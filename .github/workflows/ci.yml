name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  stock:
    name: scalar path on stock toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.x' }
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # #85: every DESIGN.md rule citation must resolve against DESIGN.md's actual
      # structure. Self-test first — the lint reaches only its clean path on a
      # healthy tree, so a green from the lint alone leaves seven branches untested.
      # It needs a git checkout (it enumerates sites with `git ls-files`) but no
      # toolchain, so it lives in the stock job where it cannot be skipped.
      - run: bash scripts/citation-lint-test.sh
      - run: bash scripts/citation-lint.sh
  simd:
    name: GOEXPERIMENT=simd
    runs-on: ubuntu-latest
    env: { GOEXPERIMENT: simd }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.x' }
      - run: go build ./...
      - run: go test ./...
      # Gates are run locally by design (they need real hardware + perf
      # denominators); CI only proves both build modes stay green.
