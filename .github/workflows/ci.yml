# ACTION VERSIONS: every action here runs on Node 24, and that is a pin with a reason
# rather than a habit of taking the newest thing. GitHub deprecated the Node 20 runtime
# (changelog 2025-09-19) and was already FORCING the previous v4/v5 majors onto Node 24
# with a warning annotation on every run — read off run 31986295744, not assumed. A
# deprecated runtime becomes broken CI eventually, and the tag window is the worst
# possible time for that, so the sweep happened in the quiet. Both workflows moved
# together: half a sweep is an inconsistency with no gate benefit.
name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  stock:
    name: scalar path on stock toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.x' }
      # setup-go v6 set GOTOOLCHAIN=local (actions/setup-go#460), which is the one thing
      # in the Node-24 sweep that changes what a green MEANS: `go` can no longer quietly
      # download a newer toolchain to satisfy go.mod, it errors instead. That is the
      # behaviour this project wants — a silent toolchain substitution would make the Go
      # version a fact about the runner rather than about the pin — so it is printed and
      # not assumed. go.mod says `go 1.26`, this job installs a newer 1.27.x, and local
      # still suffices: the directive is a floor, so nothing needs downloading.
      #
      # WHY 1.27.x AND NOT 1.26.x (2026-08-28, T23). This pin was `1.26.x` and is now the
      # tree's *only* machine-checked statement of which archsimd API keel is written
      # against. go.mod cannot carry it — archsimd ships with the toolchain, so it is not a
      # module requirement — and the 1.26→1.27 rename is a swap with no spelling that
      # satisfies both. The pin therefore stopped being a convenience the day the dev host
      # moved: it is what fails a tree written against the wrong one. It failed fed1e70
      # exactly that way, from the 1.26 side, which is this job earning its keep.
      - run: go version && go env GOTOOLCHAIN
      - run: go build ./...
      # `gofmt -l` exits 0 whether or not it lists anything, so it has to be made to
      # gate: an unformatted file sat at HEAD through green CI because nothing here
      # ran it at all. Printed as well as gated, so the failure names the file.
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test ./...
      # `make lint` and NOT a copy of its contents (2026-08-28). This was three lines —
      # `go vet`, then #85's citation lint and its self-test — while the Makefile's `lint`
      # target had grown a fourth, `scripts/baseline-test.sh`. So the two lists silently
      # diverged, and the cost was exact: gate-p5.sh's comment beside that very check
      # claimed "lint runs on every push … and catches a broken reader before a $24/hr
      # fleet renders a bar from it", which was false, because nothing here ran it. A
      # BASELINE-REGISTERED reader broken by f0e9e0b therefore survived to a $3.888/hr
      # fleet run. One definition of green, in the Makefile, is what the `docs` job
      # already does and for this reason.
      #
      # It lives in the stock job because none of it needs GOEXPERIMENT, and the citation
      # lint additionally needs the git checkout (it enumerates with `git ls-files`) but
      # no toolchain. The self-tests inside the target run before the lints they cover,
      # since a lint reaches only its clean path on a healthy tree.
      - run: make lint
  # What this job's green means, exactly (#88, ruled 2026-08-16): "the simd
  # toolchain compiles all paths, and correctness is verified on scalar,
  # deterministically." It does NOT mean the AVX-512 kernels ran — see the second
  # correction below for why that sentence survives while the reason under it did
  # not. #87's SIGILL was the Level-3 fallback gap biting.
  #
  # CORRECTION, measured on this job's first run under the read-back (2026-08-16): the
  # earlier version of this comment said "the vector path is not exercised here at
  # all", and that is false. The runners have AVX2, so the *Level 1* backend reads
  # back as `avx2` under default dispatch — vector code does run in CI, one level
  # down from where anyone was looking. Precisely the claim the read-back was added to
  # settle, falsified on contact with the instrument, which is the argument for
  # printing it rather than reasoning about it.
  #
  # SECOND CORRECTION, measured 2026-08-29 UTC: "GitHub's runners have no AVX-512"
  # is false, and it is false in the worst available way — not "they gained it",
  # but *it is drawn per run*. Two runs of THIS workflow, forty minutes apart, same
  # repo, same `runs-on: ubuntu-latest`:
  #
  #   33225065217  keel-l1-available: avx512 avx2 scalar   (red: T27 fired, #117)
  #   33226797681  keel-l1-available: avx2 scalar          (green)
  #
  # Read those two lines together and the consequence is sharper than the erratum.
  # The green run **did not execute the code path the red run failed on**, so CI
  # green on the T27 fix is not evidence the fix works; the evidence is the fleet
  # (2 AVX-512 microarchitectures x 4 dispatch pins). And a red run on this
  # workflow can be an AVX-512 finding that the retry silently converts to green
  # by landing on different silicon — which is the one failure mode that would
  # make a reader distrust the instrument rather than the code.
  #
  # The design below is unaffected, and the rejected-options paragraph is why: it
  # already said "whatever hardware the runner lottery deals". Determinism plus
  # read-back is correct precisely because the hardware is a draw. What was wrong
  # was a flat claim about the fleet sitting two paragraphs above an argument that
  # assumed the opposite. The read-back is what caught it, again.
  #
  # Two options were rejected. Asserting "a vector backend registered" would fail
  # spuriously on whatever hardware the runner lottery deals. Merely documenting
  # "scalar-ish under a simd toolchain" leaves the green's meaning varying run to
  # run, which is the passive-honest option. So: DETERMINISM PLUS READ-BACK. The
  # judged leg pins KEEL_FORCE=scalar and asserts the read-back agrees, so the
  # claim is identical every run and the pin is proven to have taken effect rather
  # than assumed — the same no-silent-downgrade property dispatch.go's panic
  # protects, checked from outside. Vector-backend *evidence* stays where it has
  # always lived: the three-host gate fleet.
  simd:
    name: GOEXPERIMENT=simd (build integrity + deterministic scalar smoke)
    runs-on: ubuntu-latest
    env: { GOEXPERIMENT: simd }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.x' }
      # Printed here too, and for a sharper reason than in the stock job: this leg's
      # whole claim is "the simd toolchain compiles every path", and which toolchain
      # that was is the subject of the sentence. Sharper again since T23's rename: on the
      # wrong minor this leg does not fail a test, it fails to compile, and the version it
      # prints is the difference between the two.
      - run: go version && go env GOTOOLCHAIN
      - run: go build ./...
      # THE JUDGED LEG. `set -o pipefail` is not decoration: without it the pipe
      # into tee reports tee's status and a failing test suite reads as a pass.
      # This repo has shipped that defect three times in other forms, so the rule
      # is now explicit wherever a status crosses a pipe.
      - name: tests, dispatch pinned to scalar
        run: |
          set -o pipefail
          KEEL_FORCE=scalar go test ./... 2>&1 | tee simd-scalar.log
          # The read-back probe, in this step so it demonstrably shares the pin with
          # the suite above. TestMain prints the dispatch markers unconditionally, but
          # `go test` shows a passing package's stdout only under -v — checked, not
          # assumed — and -v over the whole suite is tens of thousands of subtest
          # lines. So the probe selects NO test (the pattern matches nothing, exit 0)
          # and exists purely to make TestMain speak. `-count=1` is load-bearing: the
          # test cache replays a previous run's recorded stdout, which would publish a
          # read-back taken under a different environment.
          #
          # One reading note for anyone scanning this step's log: because the probe runs
          # NO test, its `keel-*-exercised:` markers are empty by construction. That is
          # the probe reporting nothing ran under it, not the suite above reporting no
          # coverage — the suite's own markers are simply not printed without -v.
          KEEL_FORCE=scalar go test -count=1 -v -run 'ZZZDispatchReadBackOnly' . 2>&1 | tee simd-scalar.log.readback
      # The assertion that the pin took. A missing marker is itself a failure — the
      # gates treat absence the same way, because "the tests passed" and "here is
      # what they covered" are two different facts.
      - name: assert the pinned backend, and publish the read-back
        run: |
          set -euo pipefail
          l1="$(sed -n 's/^keel-l1-active: *//p' simd-scalar.log.readback | tail -1)"
          kern="$(sed -n 's/^keel-sgemm-active: *//p' simd-scalar.log.readback | tail -1)"
          avail_l1="$(sed -n 's/^keel-l1-available: *//p' simd-scalar.log.readback | tail -1)"
          avail_k="$(sed -n 's/^keel-sgemm-available: *//p' simd-scalar.log.readback | tail -1)"
          if [ -z "$l1" ] || [ -z "$kern" ]; then
            echo "::error::no dispatch read-back in the test output (keel-l1-active / keel-sgemm-active); a run that cannot say what it dispatched to has not reported its coverage" >&2
            exit 1
          fi
          if [ "$l1" != "scalar" ]; then
            echo "::error::KEEL_FORCE=scalar was set but Level 1 dispatched to '$l1'; the pin did not take, so this leg's determinism claim is void" >&2
            exit 1
          fi
          case "$kern" in
            */scalar) : ;;
            *) echo "::error::KEEL_FORCE=scalar was set but the Level-3 microkernel read back as '$kern'" >&2; exit 1 ;;
          esac
          {
            echo "### GOEXPERIMENT=simd — what this green claims"
            echo
            echo "**Claimed:** the simd toolchain compiles every path, and correctness is verified"
            echo "on the scalar backend, deterministically (\`KEEL_FORCE=scalar\`, asserted below)."
            echo
            echo "**Not claimed:** that any vector kernel executed — nor that this runner could have run"
            echo "one. Whether \`ubuntu-latest\` deals AVX-512 is drawn **per run**, measured both ways on"
            echo "2026-08-29 within forty minutes, so read the availability rows below instead of assuming"
            echo "either answer. Vector-backend evidence comes from the three-host gate fleet, not from CI."
            echo
            echo '| read-back | value |'
            echo '|---|---|'
            echo "| Level-1 active (asserted \`scalar\`) | \`$l1\` |"
            echo "| Level-3 microkernel (asserted \`*/scalar\`) | \`$kern\` |"
            echo "| Level-1 available here | \`${avail_l1:-none reported}\` |"
            echo "| Level-3 kernels available here | \`${avail_k:-none reported}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      # THE OPPORTUNISTIC LEG. Same suite under whatever dispatch the runner's own
      # CPU selects, with the selected backend REPORTED AND NOT JUDGED: asserting a
      # value here is the runner-lottery failure this design rejects. Correctness is
      # still judged — a red is a red — but which backend produced it is a fact
      # about the machine, not a criterion. Cheap, and it is the one way a future
      # AVX-512 runner would give real vector coverage without anyone noticing to
      # ask: the summary would simply start saying so.
      - name: tests, default dispatch (backend reported, not judged)
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee simd-default.log
          go test -count=1 -v -run 'ZZZDispatchReadBackOnly' . 2>&1 | tee simd-default.log.readback
      - name: publish the default-dispatch read-back
        if: always()
        run: |
          set -euo pipefail
          l1="$(sed -n 's/^keel-l1-active: *//p' simd-default.log.readback | tail -1)"
          kern="$(sed -n 's/^keel-sgemm-active: *//p' simd-default.log.readback | tail -1)"
          {
            echo
            echo "**Default dispatch on this runner** (reported, judged by nothing):"
            echo "Level 1 \`${l1:-unreported}\`, Level 3 \`${kern:-unreported}\`."
            # Named per level, not as one "vector or not" bit, because the two levels
            # gate on different features and the first run of this leg already split
            # them: that runner had AVX2 and not AVX-512, so Level 1 selected `avx2`
            # while the Level-3 microkernels stayed scalar. "This runner exercised a
            # vector path" would have been true and would have hidden which one, which
            # is the imprecision #88 exists to remove. (That runner. Not the fleet —
            # AVX-512 is drawn per run; see the second correction above.)
            if [ "${l1:-}" != "scalar" ] && [ "${l1:-}" != "" ]; then
              echo "- Level 1 ran the **\`$l1\`** backend: real vector coverage, from"
              echo "  hardware CI happens to have. Opportunistic — still not a criterion."
            else
              echo "- Level 1 was scalar, duplicating the judged leg."
            fi
            case "${kern:-}" in
              */scalar|"") echo "- Level 3 was the scalar microkernel, so **no vector kernel executed**."
                           echo "  Which of the two reasons applies is in the availability rows above and is"
                           echo "  not asserted here: this runner may lack AVX-512 (drawn per run), or it may"
                           echo "  have it while the shape registry declines to fingerprint its µarch (#25)."
                           echo "  Either way the vector-kernel evidence comes from the three-host fleet." ;;
              *)           echo "- Level 3 ran **\`$kern\`** — a vector microkernel executed in CI, on hardware"
                           echo "  the lottery dealt. Worth acting on, not just noting: this leg judges"
                           echo "  nothing, so a pass here is coverage nobody asked for and nobody counted." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
      # Gates are run locally by design (they need real hardware + perf
      # denominators); CI proves build integrity and a deterministic smoke.
